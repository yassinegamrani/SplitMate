<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SplitMate</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="..." crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <aside class="asideBar">
        <header>
            <div class="logoSideBar">
                <i class="fa-solid fa-wallet"></i>
                <h3 class="splitMate">&ensp;Split<span>Mate</span></h3>
            </div>
        </header>
        <br /><br /><br /><br /><br /><br />
        <main>
            <div>
                <div class="asideOptions">
                    <i class="fa-solid fa-border-all"></i>
                    <a href="#">&ensp;&ensp;Tableau de bord</a>
                </div>
                <br /><br />
                <div class="asideOptions">
                    <i class="fa-solid fa-user-group"></i>
                    <a href="#">&ensp;&ensp;Mes groupes</a>
                </div>
                <br /><br />
                <div class="asideOptions">
                    <i class="fa-regular fa-file-lines"></i>
                    <a href="#">&ensp;&ensp;Dépenses</a>
                </div>
                <br /><br />
                <div class="asideOptions">
                    <i class="fa-solid fa-wallet"></i>
                    <a href="#">&ensp;&ensp;Soldes</a>
                </div>
                <br /><br /><br /><br /><br />
            </div>
        </main>
        <br /><br /><br /><br /><br /><br /><br />
        <footer>
            <div>
                <h3>Yasiine Gamrani</h3>
                <p>gamrani@gmr.com</p>
            </div>
        </footer>
    </aside>
    <section class="page-section">
        <header>
            <div>
                <h3>Mes groupes</h3>
                <p>Gérez vos groupes et leurs dépenses partagées.</p>
            </div>
            <button style="background-color: red; padding: 0px 30px;">
                <i class="fa-solid fa-plus"></i>
                <h3>Nouveau groupe</h3>
            </button>
        </header>

        <main class="hero-section" style="background-color: #F8FAFC; margin: -20px">
            <div class="search-inputContainer">
                <label for="searchInput"><i class="fa-solid fa-magnifying-glass"></i></label>
                <input type="text" id="searchInput" placeholder="Rechercher une dépense...">

                <button type="button" class="action-btn">
                    <span>+</span>
                    Ajouter une dépense
                </button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Groupe</th>
                        <th>Payeur</th>
                        <th>Date</th>
                        <th>Montant</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>
                            <span>🛒</span>
                            <strong>Courses Carrefour</strong>
                        </td>

                        <td>Colocation République</td>

                        <td>
                            <span>K</span>
                            Karim
                        </td>

                        <td>18 janvier 2004</td>

                        <td>
                            <strong>54,40 €</strong>
                        </td>

                        <td>
                            <button type="button" aria-label="Plus d'actions">
                                •••
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </main>
    </section>
</body>

</html>
